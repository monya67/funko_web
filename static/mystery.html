<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3a0002">
    <title>?</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px 16px;
            background: #3a0002 repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, 0.08) 3px 4px);
            color: #f3f1ee; font-family: Arial, Helvetica, sans-serif; text-align: center;
        }
        main { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; }
        .mark { font: 700 clamp(120px, 30dvh, 260px)/0.95 Arial, Helvetica, sans-serif; user-select: none; }
        .title { margin: 10px 0 0; font-size: clamp(20px, 3.4dvh, 28px); font-weight: 400; letter-spacing: 0.42em; margin-right: -0.42em; }
        .sub { margin: 10px 0 0; font-size: clamp(11px, 1.8dvh, 14px); letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.9; }
        .view { width: 100%; display: flex; flex-direction: column; align-items: center; }

        .timer { display: flex; align-items: flex-start; justify-content: center; gap: clamp(8px, 3vw, 22px); margin-top: 24px; font-variant-numeric: tabular-nums; }
        .unit b { display: block; min-width: 1.3em; font-size: clamp(32px, min(11vw, 7dvh), 56px); font-weight: 400; line-height: 1; letter-spacing: 0.04em; }
        .unit span { display: block; margin-top: 10px; font-size: clamp(9px, 2.6vw, 12px); letter-spacing: 0.2em; margin-right: -0.2em; opacity: 0.85; }
        .sep { font-size: clamp(26px, min(9vw, 6dvh), 46px); line-height: 1.1; opacity: 0.85; }

        .count { margin: 16px 0 12px; font-size: min(9.4vw, clamp(30px, 6.4dvh, 54px)); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .bar { width: 100%; height: 18px; padding: 2px; border: 1.5px solid #f3f1ee; border-radius: 999px; }
        .bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: #f3f1ee; transition: width 0.3s ease; }
        .press {
            display: block; width: min(320px, 100%); margin-top: 18px; padding: 18px 20px; border: 0; border-radius: 2px;
            background: #f3f1ee; color: #4a0003; font: 700 19px/1 Arial, Helvetica, sans-serif; letter-spacing: 0.1em; text-decoration: none;
            cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .press { transition: transform 0.06s ease-out; }
        .admin { position: fixed; right: 12px; bottom: 12px; padding: 8px 12px; border: 1px solid #f3f1ee; border-radius: 6px; color: #f3f1ee; font-size: 13px; text-decoration: none; }
        .press:active { transform: scale(0.96); }
        .press:focus-visible, .admin:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        [hidden] { display: none !important; }
        @media (prefers-reduced-motion: reduce) { .press, .bar i { transition: none; } }
    </style>
</head>
<body>
<main>
    <div class="mark" role="img" aria-label="Вопросительный знак">?</div>
    <h1 class="title">ОТКРЫТИЕ</h1>

    <!-- until the opening: only the countdown -->
    <div class="view" id="waiting" hidden>
        <div class="timer" role="timer" aria-label="До открытия">
            <div class="unit"><b id="t-d">00</b><span>ДНЯ</span></div><div class="sep">:</div>
            <div class="unit"><b id="t-h">00</b><span>ЧАСА</span></div><div class="sep">:</div>
            <div class="unit"><b id="t-m">00</b><span>МИНУТ</span></div><div class="sep">:</div>
            <div class="unit"><b id="t-s">00</b><span>СЕКУНД</span></div>
        </div>
    </div>

    <!-- after the opening: the shared clicker -->
    <div class="view" id="clicker" hidden>
        <p class="sub">Первое раскрытие — 100 000 кликов</p>
        <div class="count" id="count">0 / 100 000</div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100000" id="bar"><i id="fill"></i></div>
        <button type="button" class="press" id="press">НАЖАТЬ</button>
    </div>
</main>
<a class="admin" id="admin" href="/mystery/boxes" hidden>Страница боксов (видят только админы)</a>
<script>
(function () {
    const $ = id => document.getElementById(id);
    const MAX_BATCH = 50;
    const state = { count: 0, goal: 100000, opens: 0, skew: 0, open: false, reached: false, unsent: 0, sending: false, failures: 0, loaded: false };
    const fmt = n => n.toLocaleString('ru-RU').replace(/ /g, ' ');
    const p2 = n => String(n).padStart(2, '0');

    function render() {
        $('waiting').hidden = !state.loaded || state.open;
        $('clicker').hidden = !state.loaded || !state.open;
        const shown = Math.min(state.goal, state.count + state.unsent);
        $('count').textContent = `${fmt(shown)} / ${fmt(state.goal)}`;
        $('fill').style.width = `${(shown / state.goal) * 100}%`;
        $('bar').setAttribute('aria-valuenow', String(shown));
    }

    function tick() {
        if (!state.loaded || state.open) return;
        const left = Math.max(0, Math.floor(state.opens - (Date.now() / 1000 + state.skew)));
        $('t-d').textContent = p2(Math.floor(left / 86400));
        $('t-h').textContent = p2(Math.floor(left / 3600) % 24);
        $('t-m').textContent = p2(Math.floor(left / 60) % 60);
        $('t-s').textContent = p2(left % 60);
        if (left === 0) sync();   // the server decides that the clicker is open
    }

    function apply(data) {
        state.count = data.count;
        state.goal = data.goal;
        state.opens = data.opens;
        state.skew = data.now - Date.now() / 1000;
        state.open = data.open;
        state.reached = data.reached;
        state.loaded = true;
        if (state.reached) {   // the goal is reached: everybody moves on to the boxes page
            state.unsent = 0;
            location.replace('/mystery/boxes');
            return;
        }
        render();
        tick();
    }

    async function sync() {
        if (state.sending) return;
        state.sending = true;
        const n = Math.min(MAX_BATCH, state.unsent);
        try {
            const res = n
                ? await fetch('/api/mystery/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n }) })
                : await fetch('/api/mystery');
            if (!res.ok) throw new Error(String(res.status));
            const data = await res.json();
            state.unsent = Math.max(0, state.unsent - n);
            state.failures = 0;
            apply(data);
        } catch (e) {
            state.failures += 1;   // clicks stay in unsent and go with the next request
        } finally {
            state.sending = false;
        }
    }

    // while waiting the clock runs here and the server is asked rarely; clicks go out every 2 s, the count refreshes every 6 s
    let lastSync = Date.now();
    setInterval(async () => {
        if (document.hidden) return;
        const base = !state.open ? 60000 : (state.unsent ? 2000 : 6000);
        if (Date.now() - lastSync < base * Math.min(8, state.failures + 1)) return;
        lastSync = Date.now();
        await sync();
    }, 500);

    $('press').addEventListener('click', e => {
        if (!e.isTrusted || !state.open || state.reached) return;   // a script calling .click() is not a click
        state.unsent = Math.min(state.unsent + 1, 500);
        render();
    });
    // holding Enter or Space must not count as clicks
    $('press').addEventListener('keydown', e => { if (e.repeat && (e.key === 'Enter' || e.key === ' ')) e.preventDefault(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
    // clicks made just before leaving the page still count
    window.addEventListener('pagehide', () => {
        const n = Math.min(MAX_BATCH, state.unsent);
        if (n) fetch('/api/mystery/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ n }), keepalive: true }).catch(() => {});
        state.unsent = 0;
    });
    setInterval(tick, 1000);
    render();
    sync();
    let adminToken = null;
    try { adminToken = localStorage.getItem('funko_token'); } catch (e) {}
    if (adminToken) {
        fetch('/api/mystery/admin/boxes', { headers: { Authorization: `Bearer ${adminToken}` } })
            .then(res => { $('admin').hidden = !res.ok; }).catch(() => {});
    }
})();
</script>
</body>
</html>
